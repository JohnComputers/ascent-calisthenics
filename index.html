<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1014">
  <meta name="description" content="A personal calisthenics skill tree, workout log, and rewards tracker.">
  <meta name="robots" content="noindex">
  <title>Ascent · Calisthenics Tracker</title>
  <link rel="icon" href="./assets/icon.png" type="image/png">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <aside class="sidebar" aria-label="Sidebar">
    <a class="brand" href="#today" data-route="today" aria-label="Ascent, Today">
      <span class="brand-icon" aria-hidden="true"></span>
      <span>ASCENT<small>CALISTHENICS</small></span>
    </a>
    <nav class="rail-nav" aria-label="Main navigation">
      <a href="#today" data-route="today"><span class="nav-icon home-icon" aria-hidden="true"></span>Today</a>
      <a href="#tree" data-route="tree"><span class="nav-icon" aria-hidden="true">♧</span>Skill tree</a>
      <a href="#history" data-route="history"><span class="nav-icon" aria-hidden="true">◷</span>History</a>
      <a href="#rewards" data-route="rewards"><span class="nav-icon" aria-hidden="true">◇</span>Rewards</a>
    </nav>
    <div class="sidebar-footer">
      <div id="rail-progress"></div>
      <button type="button" class="settings-link" data-action="settings"><span aria-hidden="true">⚙</span> Data &amp; settings</button>
    </div>
  </aside>
  <div class="frame">
    <header class="topbar" id="topbar">
      <div class="topbar-label"><h1>Ascent</h1></div>
    </header>
    <main id="main" tabindex="-1">
      <div class="panel notice"><p>Opening your training log…</p></div>
      <noscript><p>Enable JavaScript to use the tracker.</p></noscript>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="Main navigation">
    <a href="#today" data-route="today"><span class="mobile-icon home-icon" aria-hidden="true"></span>Today</a>
    <a href="#tree" data-route="tree"><span class="mobile-icon" aria-hidden="true">♧</span>Tree</a>
    <button type="button" data-action="start-workout" class="mobile-log"><span aria-hidden="true">+</span>Log</button>
    <a href="#history" data-route="history"><span class="mobile-icon" aria-hidden="true">◷</span>History</a>
    <a href="#rewards" data-route="rewards"><span class="mobile-icon" aria-hidden="true">◇</span>Rewards</a>
  </nav>
  <dialog id="app-dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./assets/app.js"></script>
</body>
</html>
